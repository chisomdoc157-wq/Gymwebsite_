<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="signup">
        <div class="logo2">
            <img src="BIG C LOGO2.png" alt="gym logo">

        <h1>Join Our Gym Today</h1>
        <p>Create your account and choose your perfect membership plan.</p>
       </div><br>
     <div class="form">
        <form action="">
            <p>
                <label for="name">First Name:</label>
                <input type="text" name="igwe" id="name" placeholder="First Name" required>
            </p>
            <p>
                <label for="othername">Last Name:</label>
                <input type="text" name="jessica" id="othername" placeholder="Last Name" required>
            </p>
            <p>
                <label for="date">Date Of Birth:</label>
                <input type="date" id="date" required>
            </p>
            <p>
                <label for="hi">Male</label>
                <input type="radio" name="joe" id="hi">

                <label for="gender">Female</label>
                <input type="radio" name="zoey" id="gender">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" name="chisom" id="email" placeholder="Email" required>
            </p>
            <p>
                <label for="phone">Cell Phone:</label>
                <input type="tel" name="number" id="phone" placeholder="Cell Phone" required>
            </p>
            <p>
                <label for="adress">Address:</label>
                <textarea name="address" id="" required></textarea>
            </p>
            <p>
                <input type="submit" value="Signup">
            </p>
        </form>
     </div>
    </div>
</body>
</html>
